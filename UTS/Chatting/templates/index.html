<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <h1 style="text-align: center; margin-bottom: 20px;">Chatting App</h1>
        <div id="username-container">
            <input type="text" id="username" placeholder="Masukkan namamu...">
            <button onclick="setUsername()">Masuk</button>
        </div>
        <div id="chat-area" style="display:none;">
            <div id="chat-box"></div>
            <div class="input-container">
                <input type="text" id="message" placeholder="Tulis pesan...">
                <button onclick="sendMessage()">Kirim</button>
            </div>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="upload-container">
                    <input type="file" name="file" id="fileInput">
                    <button type="submit">Kirim File</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
