<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Chat - {{ sender }} ↔ {{ receiver }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/images/{{ profile_file }}">
  <style>
    :root {
      --bg: #0f0f1a;
      --msg-me: #00ffc3;
      --msg-other: #1e1e2f;
      --text: #ffffff;
      --header: #1a1a2e;
      --glow-pink: #ff00cc;
      --glow-blue: #00ffff;
      --glow-purple: rgb(153, 0, 255);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: var(--header);
      color: var(--text);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 10px var(--glow-purple);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    header a {
      color: var(--glow-blue);
      text-decoration: none;
      font-size: 1.5rem;
    }

    .menu-container {
      position: relative;
    }

    .menu-button {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--glow-blue);
      cursor: pointer;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: var(--header);
      border: 1px solid var(--glow-pink);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--glow-pink);
      z-index: 1000;
      min-width: 140px;
    }

    .dropdown-menu button {
      background: none;
      border: none;
      padding: 10px 20px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      color: white;
    }

    .dropdown-menu button:hover {
      background-color: #330022;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .chat-message {
      max-width: 70%;
      padding: 0.5rem 1rem;
      margin: 0.3rem 0;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 0.9rem;
    }

    .me {
      background-color: #003333;
      color: var(--glow-blue);
      align-self: flex-end;
      text-align: right;
      box-shadow: 0 0 8px var(--glow-blue);
    }

    .other {
      background-color: #240033;
      color: var(--glow-pink);
      align-self: flex-start;
      text-align: left;
      box-shadow: 0 0 8px var(--glow-pink);
    }

    .chat-message small {
      font-size: 0.7rem;
      opacity: 0.7;
      display: block;
      margin-top: 5px;
    }

    .input-container,
    form.upload-form {
      background: var(--header);
      padding: 0.7rem 1rem;
      border-top: 2px solid var(--glow-purple);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-container input[type="text"] {
      flex: 1;
      padding: 0.5rem 1rem;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 1rem;
      background-color: #0f0f1a;
      color: var(--text);
    }

    .input-container button,
    form.upload-form button {
      padding: 0.5rem 1rem;
      background: var(--glow-purple);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--glow-purple);
    }

    .upload-form input[type="file"] {
      display: none;
    }

    .file-label {
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--glow-blue);
      user-select: none;
    }

    #file-name img {
      max-height: 50px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-info">
      <a href="{{ url_for('choose_contact') }}">←</a>
      <img src="{{ url_for('static', filename='images/' + profile_file) }}" alt="{{ receiver }}">
      <strong>{{ receiver }}</strong>
    </div>
    <div class="menu-container">
      <button class="menu-button" onclick="toggleMenu()">⋮</button>
      <div class="dropdown-menu" id="dropdown">
        <form action="/delete_chat" method="POST" onsubmit="return confirmDelete()">
          <input type="hidden" name="sender" value="{{ sender }}">
          <input type="hidden" name="receiver" value="{{ receiver }}">
          <button type="submit">Hapus Pesan</button>
        </form>
      </div>
    </div>
  </header>

  <div class="chat-container">
    <div id="chat-box" class="chat-box">
      {% for msg in history %}
      <div class="chat-message {{ 'me' if msg.sender == sender else 'other' }}">
        <div>{{ msg.message | safe }}</div>
        <small>{{ msg.time }}</small>
      </div>
      {% endfor %}
    </div>

    <form class="input-container">
      <input type="text" id="message-input" placeholder="Tulis pesan..." autocomplete="off" required />
      <button type="submit">Kirim</button>
    </form>

    <form class="upload-form" action="/upload/{{ sender }}/{{ receiver }}" method="POST" enctype="multipart/form-data">
      <label for="file-input" class="file-label">📎</label>
      <input type="file" id="file-input" name="file"
        accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.zip,.rar"
        onchange="previewFile(event)" required />
      <span id="file-name"></span>
      <button type="submit">Upload</button>
    </form>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();

    document.querySelector('.input-container').addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById("message-input");
      const message = input.value.trim();
      if (!message) return;
      socket.emit('send_message', {
        sender: "{{ sender }}",
        receiver: "{{ receiver }}",
        message: message
      });
      input.value = "";
    });

    socket.on('receive_message', function (data) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "chat-message " + (data.sender === "{{ sender }}" ? "me" : "other");
      div.innerHTML = `<div>${data.message}</div><small>${data.time}</small>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    const uploadForm = document.querySelector('.upload-form');
    const fileInput = document.getElementById("file-input");
    uploadForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(uploadForm);
      fetch(uploadForm.action, {
        method: 'POST',
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          socket.emit('send_message', {
            sender: "{{ sender }}",
            receiver: "{{ receiver }}",
            message: data.message
          });
          fileInput.value = "";
          document.getElementById("file-name").innerHTML = "";
        });
    });

    function toggleMenu() {
      const menu = document.getElementById("dropdown");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function confirmDelete() {
      return confirm("Apakah kamu yakin ingin menghapus semua pesan ini?");
    }

    function previewFile(event) {
      const file = event.target.files[0];
      const fileNameSpan = document.getElementById("file-name");
      if (!file) return;
      const fileType = file.type;
      fileNameSpan.innerHTML = "";
      if (fileType.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          fileNameSpan.appendChild(img);
        };
        reader.readAsDataURL(file);
      } else {
        const icon = document.createElement("span");
        icon.textContent = "📄 " + file.name;
        fileNameSpan.appendChild(icon);
      }
    }
  </script>
</body>
</html>
